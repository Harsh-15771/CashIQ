version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cashiq-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo_key}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mock_12345}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mock_secret_67890}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-mock_webhook_secret_abc123}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cashiq-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
